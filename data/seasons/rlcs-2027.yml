# RLCS 2027 season, written by hand.
#
# RLCS 2027 uses a new format, the "RLCS Club Championship":
#   1. Club Kick-Off Opens: 4 online regional qualifiers (one team each goes to London)
#   2. Club Championship Kick-Off: LAN in London with 20 invited clubs + 4 qualifiers
#   3. Regional online league play (dates and format not announced yet)
#   4. Club Championship Finale: 16-team LAN (date and place not announced yet)
#
# Rules for editing:
#   - Never change an event `id` once the bot has posted about it (it's how the bot remembers).
#   - Dates are the event's local days (YYYY-MM-DD) in its `timezone`.
#   - `status: tba` events are ignored by the posting rules until they get dates and `status: confirmed`.
#   - Run `npm run data:check` after editing.
#
# Not added because unconfirmed (only a ticket resale listing, no official source):
#   Major 1 (Feb 2027), Major 2 (May 2027), World Championship (Sep 2027).
#   Source: https://www.koobit.com/major-1-e9817

