name: Keep alive

# GitHub disables scheduled workflows after 60 days without repository activity.
# Between events the bot may not commit for months, so add an empty commit when needed.
on:
  schedule:
    - cron: '0 3 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Empty commit if the repo has been quiet for 30 days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled workflows active'
          git push
